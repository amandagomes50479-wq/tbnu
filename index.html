<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starlink - Atualizando</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 320px;
            text-align: center;
            gap: 28px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 5px;
            padding-left: 5px; /* Compensa o letter-spacing para centralizar perfeitamente */
            text-transform: uppercase;
            color: #ffffff;
            white-space: nowrap;
        }

        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            flex-shrink: 0;
        }

        .loader-text {
            font-size: 15px;
            line-height: 1.5;
            color: #d1d5db;
            font-weight: 400;
            max-width: 280px;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="brand-title">STARLINK</div>
        <div class="loader-spinner"></div>
        <div class="loader-text">Estamos atualizando o Aplicativo junto ao satélite</div>
    </div>

</body>
</html>
